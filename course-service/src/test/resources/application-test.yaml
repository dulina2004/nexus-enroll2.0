spring:
  datasource:
    url: jdbc:h2:mem:nexus_course;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=LEVEL,STATUS,YEAR,KEYWORD
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never
