server:
  port: 8080

spring:
  application:
    name: api-gateway

  autoconfigure:
    exclude:
      - org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration

  cloud:
    discovery:
      enabled: false
      reactive:
        enabled: false
    gateway:
      # CORS is handled by the single CorsWebFilter bean in CorsConfig.java.
      # Do NOT also configure globalcors here - Spring Cloud Gateway's
      # globalcors and a CorsWebFilter both add Access-Control-Allow-Origin
      # headers, and browsers reject the resulting duplicate header.
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: student-service
          uri: ${STUDENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/students/**

        - id: course-service
          uri: ${COURSE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/courses/**

        - id: enrollment-service
          uri: ${ENROLLMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/enrollments/**

        - id: faculty-service
          uri: ${FACULTY_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/faculty/**

        - id: academic-record-service
          uri: ${ACADEMIC_RECORD_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/records/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/notifications/**

        - id: reporting-service
          uri: ${REPORTING_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/reports/**

jwt:
  secret: ${JWT_SECRET:c3VwZXJzZWNyZXRqd3RzaWduaW5na2V5bmV4dXNlbnJvbGxtaWdyYXRpb24yMDI2}
  expiration-ms: 28800000
  issuer: nexusenroll

management:
  endpoints:
    web:
      exposure:
        include: health,info,routes
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.nexusenroll: DEBUG
    org.springframework.cloud.gateway: INFO
