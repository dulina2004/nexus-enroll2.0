spring:
  application:
    name: student-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nexus_student}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

server:
  port: 8083

services:
  academic-record-service:
    url: ${ACADEMIC_RECORD_SERVICE_URL:http://localhost:8086}
  enrollment-service:
    url: ${ENROLLMENT_SERVICE_URL:http://localhost:8084}
  course-service:
    url: ${COURSE_SERVICE_URL:http://localhost:8082}

logging:
  level:
    com.nexusenroll: DEBUG
    org.springframework.security: INFO
