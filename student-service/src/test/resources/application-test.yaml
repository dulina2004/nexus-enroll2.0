spring:
  datasource:
    url: jdbc:h2:mem:nexus_student;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=STATUS,YEAR,KEYWORD,STATE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never
