services:
  mysql:
    image: mysql:8.4
    container_name: nexus-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: nexus_auth
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./auth-service
    container_name: nexus-auth-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_auth
      DB_USERNAME: root
      DB_PASSWORD: password
      JWT_SECRET: c3VwZXJzZWNyZXRqd3RzaWduaW5na2V5bmV4dXNlbnJvbGxtaWdyYXRpb24yMDI2
    depends_on:
      mysql:
        condition: service_healthy

  course-service:
    build:
      context: ./course-service
    container_name: nexus-course-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_course
      DB_USERNAME: root
      DB_PASSWORD: password
    depends_on:
      mysql:
        condition: service_healthy

  student-service:
    build:
      context: ./student-service
    container_name: nexus-student-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_student
      DB_USERNAME: root
      DB_PASSWORD: password
    depends_on:
      mysql:
        condition: service_healthy

  enrollment-service:
    build:
      context: ./enrollment-service
    container_name: nexus-enrollment-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_enrollment
      DB_USERNAME: root
      DB_PASSWORD: password
      COURSE_SERVICE_URL: http://course-service:8082
      STUDENT_SERVICE_URL: http://student-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
    depends_on:
      mysql:
        condition: service_healthy

  faculty-service:
    build:
      context: ./faculty-service
    container_name: nexus-faculty-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_faculty
      DB_USERNAME: root
      DB_PASSWORD: password
      ACADEMIC_RECORD_SERVICE_URL: http://academic-record-service:8086
    depends_on:
      mysql:
        condition: service_healthy

  academic-record-service:
    build:
      context: ./academic-record-service
    container_name: nexus-academic-record-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_academic_record
      DB_USERNAME: root
      DB_PASSWORD: password
    depends_on:
      mysql:
        condition: service_healthy

  notification-service:
    build:
      context: ./notification-service
    container_name: nexus-notification-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_notification
      DB_USERNAME: root
      DB_PASSWORD: password
    depends_on:
      mysql:
        condition: service_healthy

  reporting-service:
    build:
      context: ./reporting-service
    container_name: nexus-reporting-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_reporting
      DB_USERNAME: root
      DB_PASSWORD: password
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8084
      FACULTY_SERVICE_URL: http://faculty-service:8085
    depends_on:
      mysql:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
    container_name: nexus-api-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      STUDENT_SERVICE_URL: http://student-service:8083
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8084
      FACULTY_SERVICE_URL: http://faculty-service:8085
      ACADEMIC_RECORD_SERVICE_URL: http://academic-record-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      REPORTING_SERVICE_URL: http://reporting-service:8088
      JWT_SECRET: c3VwZXJzZWNyZXRqd3RzaWduaW5na2V5bmV4dXNlbnJvbGxtaWdyYXRpb24yMDI2
    depends_on:
      - auth-service
      - course-service
      - student-service
      - enrollment-service
      - faculty-service
      - academic-record-service
      - notification-service
      - reporting-service

volumes:
  mysql_data:
