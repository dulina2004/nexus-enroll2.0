services:
  mysql:
    image: mysql:8.4
    container_name: nexus-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: nexus_auth
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexus-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: nexus-auth-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_auth
      DB_USERNAME: root
      DB_PASSWORD: password
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nexus-network

  course-service:
    build:
      context: .
      dockerfile: course-service/Dockerfile
    container_name: nexus-course-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_course
      DB_USERNAME: root
      DB_PASSWORD: password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nexus-network

  student-service:
    build:
      context: .
      dockerfile: student-service/Dockerfile
    container_name: nexus-student-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_student
      DB_USERNAME: root
      DB_PASSWORD: password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nexus-network

  enrollment-service:
    build:
      context: .
      dockerfile: enrollment-service/Dockerfile
    container_name: nexus-enrollment-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_enrollment
      DB_USERNAME: root
      DB_PASSWORD: password
      COURSE_SERVICE_URL: http://course-service:8082
      STUDENT_SERVICE_URL: http://student-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nexus-network

  faculty-service:
    build:
      context: .
      dockerfile: faculty-service/Dockerfile
    container_name: nexus-faculty-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_faculty
      DB_USERNAME: root
      DB_PASSWORD: password
      ACADEMIC_RECORD_SERVICE_URL: http://academic-record-service:8086
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nexus-network

  academic-record-service:
    build:
      context: .
      dockerfile: academic-record-service/Dockerfile
    container_name: nexus-academic-record-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_academic_record
      DB_USERNAME: root
      DB_PASSWORD: password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nexus-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: nexus-notification-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_notification
      DB_USERNAME: root
      DB_PASSWORD: password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nexus-network

  reporting-service:
    build:
      context: .
      dockerfile: reporting-service/Dockerfile
    container_name: nexus-reporting-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nexus_reporting
      DB_USERNAME: root
      DB_PASSWORD: password
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8084
      FACULTY_SERVICE_URL: http://faculty-service:8085
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nexus-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: nexus-api-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      STUDENT_SERVICE_URL: http://student-service:8083
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8084
      FACULTY_SERVICE_URL: http://faculty-service:8085
      ACADEMIC_RECORD_SERVICE_URL: http://academic-record-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      REPORTING_SERVICE_URL: http://reporting-service:8088
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      auth-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      enrollment-service:
        condition: service_healthy
      faculty-service:
        condition: service_healthy
      academic-record-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
    networks:
      - nexus-network

  frontend:
    build:
      context: ../nexus-enroll2.0-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_USE_MOCK_FALLBACK: "false"
    container_name: nexus-frontend
    restart: on-failure
    ports:
      - "8085:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge

volumes:
  mysql_data:
